name: ai-bid-advisor

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: [vector]
    command:
      - etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes: [etcd_data:/etcd]
    networks: [vector]

  milvus:
    image: milvusdb/milvus:v2.5.5
    profiles: [vector]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: ${MILVUS_MINIO_ADDRESS:?provide the MinIO host:port reachable from Milvus}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?provide through the deployment environment}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?provide through the deployment environment}
    depends_on: [etcd]
    volumes: [milvus_data:/var/lib/milvus]
    ports:
      - "127.0.0.1:19530:19530"
    networks: [vector]

networks:
  # This network needs egress because Milvus stores vector payloads in the
  # externally managed MinIO endpoint.
  vector: {}

volumes:
  etcd_data: {}
  milvus_data: {}
