[project]
name = "bid-wise-api"
version = "0.1.0"
description = "Bid-Wise AI 投标参谋 API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "httpx>=0.28,<1",
  "langchain>=1.3,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "minio>=7.2,<8",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "pgvector>=0.5,<1",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "jieba>=0.42,<1",
]

[dependency-groups]
dev = [
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
