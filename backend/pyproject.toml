[project]
name = "ai-bid-advisor-api"
version = "0.1.0"
description = "AI 投标参谋长 P0 API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "tenacity>=8.3,<9",
  "langchain-openai>=1.4.2,<2",
  "langgraph>=1.2.10,<2",
  "langgraph-checkpoint-postgres>=3.1.2,<4",
  "minio>=7.2,<8",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
  "python-docx>=1.2.0",
  "reportlab>=5.0.0",
  "pgvector>=0.5.0",
  "markitdown>=0.0.19",
  "jieba>=0.42,<1",
  "pypdfium2>=4.0,<5",
  "cryptography>=44",
  "asyncpg>=0.31.0",
  "pymupdf>=1.28.2",
  "arq>=0.26,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-httpx>=0.34,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires TEST_DATABASE_URL and a migrated PostgreSQL database"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
